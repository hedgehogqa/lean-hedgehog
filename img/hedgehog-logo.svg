  <g clip-path="url(#ground)">
    <circle cx="296" cy="310" r="150" fill="url(#shade)"/>
    <circle cx="296" cy="310" r="150" fill="url(#gloss)"/>
  </g>
  <g fill="#1e1b4b">
    <rect x="262" y="404" width="34" height="18" rx="9"/>
    <rect x="352" y="404" width="34" height="18" rx="9"/>
  </g>
  <circle cx="196" cy="276" r="19" fill="#bfdbfe"/>
  <path fill="url(#face)"
        d="M 60 394 Q 112 322 176 262 Q 268 292 252 412 L 96 412
           Q 66 412 60 394 Z"/>
  <circle cx="66" cy="393" r="10" fill="#1e1b4b"/>
  <circle cx="156" cy="346" r="12" fill="#1e1b4b"/>
  <circle cx="160" cy="342" r="4" fill="#ffffff"/>
