<?xml version="1.0" encoding="UTF-8"?>
<!--
  The lean-hedgehog logo: the Hedgehog of haskell-hedgehog's img/, redrawn
  from circles, triangles and two gradients.  Each quill is two facets, one
  lit and one in shade.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
     aria-labelledby="title">
  <title id="title">lean-hedgehog</title>
  <defs>
    <linearGradient id="lit" gradientUnits="userSpaceOnUse"
                    x1="90" y1="90" x2="500" y2="430">
      <stop offset="0" stop-color="#99f6e4"/>
      <stop offset="0.45" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="shade" gradientUnits="userSpaceOnUse"
                    x1="90" y1="90" x2="500" y2="430">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.45" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <radialGradient id="gloss" gradientUnits="userSpaceOnUse"
                    cx="250" cy="225" r="150">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ground">
      <rect x="0" y="0" width="512" height="412"/>
    </clipPath>
  </defs>
  <g fill="url(#lit)">
    <polygon points="148.3,300.8 99.0,249.8 155.1,280.1"/>
    <polygon points="157.3,258.3 125.0,195.1 169.9,240.4"/>
    <polygon points="178.4,220.2 165.9,150.3 195.6,206.7"/>
    <polygon points="209.6,189.9 217.9,119.4 230.0,182.0"/>
    <polygon points="248.3,169.9 276.7,104.9 270.1,168.3"/>
    <polygon points="291.1,162.1 337.2,108.2 312.4,166.9"/>
    <polygon points="334.3,167.0 394.2,128.9 353.3,177.9"/>
    <polygon points="374.2,184.4 442.6,165.3 389.3,200.3"/>
    <polygon points="407.4,212.5 478.3,214.2 417.1,232.1"/>
    <polygon points="430.9,249.2 498.3,271.3 434.5,270.7"/>
    <polygon points="442.8,291.0 500.8,331.9 440.0,312.7"/>
    <polygon points="442.0,334.5 485.6,390.5 433.0,354.5"/>
  </g>
  <g fill="url(#shade)">
    <polygon points="155.1,280.1 99.0,249.8 157.3,258.3"/>
    <polygon points="169.9,240.4 125.0,195.1 178.4,220.2"/>
    <polygon points="195.6,206.7 165.9,150.3 209.6,189.9"/>
    <polygon points="230.0,182.0 217.9,119.4 248.3,169.9"/>
    <polygon points="270.1,168.3 276.7,104.9 291.1,162.1"/>
    <polygon points="312.4,166.9 337.2,108.2 334.3,167.0"/>
    <polygon points="353.3,177.9 394.2,128.9 374.2,184.4"/>
    <polygon points="389.3,200.3 442.6,165.3 407.4,212.5"/>
    <polygon points="417.1,232.1 478.3,214.2 430.9,249.2"/>
    <polygon points="434.5,270.7 498.3,271.3 442.8,291.0"/>
    <polygon points="440.0,312.7 500.8,331.9 442.0,334.5"/>
    <polygon points="433.0,354.5 485.6,390.5 428.5,375.9"/>
