name = "hedgehog"
version = "0.3.0"
description = "Zero-dependency property-based and state machine testing."
keywords = ["testing", "property-based-testing", "shrinking"]
homepage = "https://github.com/hedgehogqa/lean-hedgehog"
license = "BSD-3-Clause"
licenseFiles = ["COPYING"]
defaultTargets = ["Hedgehog", "examples"]
testDriver = "hedgehogTest"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[lean_lib]]
name = "Hedgehog"

[[lean_lib]]
name = "HedgehogTest"

[[lean_exe]]
name = "hedgehogTest"
root = "HedgehogTest"

[[lean_lib]]
name = "Examples"

[[lean_exe]]
name = "examples"
root = "Examples"
